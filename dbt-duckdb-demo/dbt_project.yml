
name: 'dbt_project'
version: '1.0.0'

profile: 'dbt_project'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_project:
    staging:
      +schema: staging
      +materialized: table
      +tags: ['staging']
      +docs:
        node_color: 'silver'
    marts:
      +schema: marts
      +materialized: view
      +tags: ['marts']

seeds:
  dbt_project:
    +schema: raw
    +tags: ['raw']
    +quote_columns: true
    +docs:
        node_color: '#c9a227'